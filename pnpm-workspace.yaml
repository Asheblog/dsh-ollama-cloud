# pnpm settings for this single-package repository.
packages:
  - '.'

# A config or manifest edit makes pnpm want to rebuild node_modules; do it
# without the interactive prompt so scripted runs (CI, agents) never hang.
confirmModulesPurge: false

# The @deepseek-ai host packages are published continuously on a nightly
# cadence; without these exemptions the release-age gate refuses to install
# the exact versions this plugin compiles against (0.2.0-rc.2, the release
# whose harness moved the provider context contract to pi-ai 0.87).
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-attachment@0.2.0-rc.2'
  - '@deepseek-ai/dsh-authorization@0.2.0-rc.2'
  - '@deepseek-ai/dsh-brand@0.2.0-rc.2'
  - '@deepseek-ai/dsh-credentials@0.2.0-rc.2'
  - '@deepseek-ai/dsh-fs@0.2.0-rc.2'
  - '@deepseek-ai/dsh-home-paths@0.2.0-rc.2'
  - '@deepseek-ai/dsh-invariants@0.2.0-rc.2'
  - '@deepseek-ai/dsh-launch-environment@0.2.0-rc.2'
  - '@deepseek-ai/dsh-llm-pi-ai@0.2.0-rc.2'
  - '@deepseek-ai/dsh-llm@0.2.0-rc.2'
  - '@deepseek-ai/dsh-sandbox@0.2.0-rc.2'
  - '@deepseek-ai/dsh-scope@0.2.0-rc.2'
  - '@deepseek-ai/dsh-session@0.2.0-rc.2'
  - '@deepseek-ai/dsh-timeout@0.2.0-rc.2'
  - '@deepseek-ai/dsh-typert-protocol@0.2.0-rc.2'
  - '@deepseek-ai/dsh-util-crypto@0.2.0-rc.2'
  - '@deepseek-ai/dsh-util-values@0.2.0-rc.2'
  - '@deepseek-ai/dsh-web@0.2.0-rc.2'
  - '@deepseek-ai/dsh-client-connection@0.2.0-rc.2'

# Skipped on purpose: pi-ai carries optional Google/protobuf provider
# dependencies whose postinstall builds this plugin never uses.
allowBuilds:
  '@google/genai': false
  protobufjs: false
