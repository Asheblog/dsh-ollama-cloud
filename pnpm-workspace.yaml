# pnpm settings for this single-package repository.
packages:
  - '.'

# A config or manifest edit makes pnpm want to rebuild node_modules; do it
# without the interactive prompt so scripted runs (CI, agents) never hang.
confirmModulesPurge: false

# The @deepseek-ai host packages are published continuously on a nightly
# cadence; without these exemptions the release-age gate refuses to install the
# exact versions this plugin compiles against. The token below tracks the
# harness release the development dependencies pin — today `0.2.2-rc.3` — so a
# bump of `devDependencies` has to bump this list with it, or a cold install
# starts refusing the very version the typecheck is meant to run on, while
# `--frozen-lockfile` (CI) rejects the lockfile it just wrote.
#
# The first group names the packages this build declares. A train bump moves all
# of them at once and peer resolution then pulls the rest of the runtime in, so
# `pnpm install` records an exemption for every transitive harness version it
# had to admit as well; the 190-odd entries after that group are its output, not
# a second opinion about what this plugin compiles against.
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-attachment@0.2.2-rc.3'
  - '@deepseek-ai/dsh-authorization@0.2.2-rc.3'
  - '@deepseek-ai/dsh-brand@0.2.2-rc.3'
