# dsh-ollama-cloud bundle patch: mount the Ollama Cloud route as one loader row,
# and repair the desktop composition's connection row so this plugin's usage
# channel can register on it.
#
# Every config field is optional. The row registers the `ollama-cloud` provider
# route with the curated cloud model catalog — each model carrying the thinking
# levels its own wire metadata reports — resolves the credential through the
# harness credentials seam (`OLLAMA_API_KEY` by default) per request, reads the
# native `/api` surface for model discovery, and serves the browser card's
# `/ollama-cloud` usage channel. Installing this bundle is the whole setup:
# pick a model, adjust its reasoning effort, and watch the account's usage.
#
# The row is addressed by id in later layers, so a profile cordis.patch.yml can
# override any field without touching this package:
#
#   - id: llm-ollama-cloud
#     config:
#       baseURL: http://localhost:11434/api
#       apiKeyEnv: ''
- insert:
    - id: llm-ollama-cloud
      name: 'dsh-ollama-cloud'
      config:
        retryPolicy:
          mode: normal
          maxRetries: 5

# `connection.rpc.handle()` mounts its channels through the *connection row's*
# own `webServer`: the channel owner is the service's context, not the caller's,
# so a caller that injects `webServer` itself still fails with
# `cannot get property "webServer" without inject`. The web-app bundle declares
# that row with `inject: [webStartup]` only, so the registration throws and the
# usage channel never mounts. A patch replaces the whole `inject` array, so the
# row's own dependency is restated next to `webServer`.
#
# The startup dependency this row carries belongs to the composition, not to
# this plugin, and that dependency has already moved once: the 0.2.0 line's row
# injects the web-runtime service `webRuntime`, `0.2.1-rc.1`'s row injects
# `webStartup` (`@deepseek-ai/dsh-web-app@0.2.1-rc.1` no longer mentions
# `webRuntime` at all). A stale name here makes this required row wait forever
# and fails the whole boot with `1 required plugin did not activate` — the
# failure 0.4.0–0.4.2 shipped, worked around in a profile patch. Two guards keep
# it from happening again: `engines.dsh` admits only the releases whose row
# injects `webStartup`, and `tests/composition.test.ts` compares this list with
# the installed composition on every `pnpm test`, so the next upstream move
# breaks the build instead of a boot.
#
# Layers apply after the bundle list, so this wins over web-app's row; profiles
# without a connection row (headless) skip the patch with a warning.
- id: connection
  inject: [webStartup, webServer]
